[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pm-doc-pipeline"
version = "0.1.0"
description = "Automated Doc-as-Code pipeline for Product Managers"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # --- Document Parsing (all offline, CPU-only) ---
    "pdfplumber>=0.11",           # PDF text extraction with layout awareness
    "PyMuPDF>=1.24",              # Alternative fast PDF engine (optional)
    "python-docx>=1.1",           # Word .docx parsing
    "python-pptx>=1.0",           # PowerPoint .pptx parsing
    "markdownify>=0.13",          # HTML to Markdown conversion
    "beautifulsoup4>=4.12",       # HTML parsing (markdownify dependency)

    # --- API Clients (for remote sources) ---
    "atlassian-python-api>=3.41",  # Confluence REST API
    "PyGithub>=2.3",               # GitHub REST API
    "webexpythonsdk>=2.0",         # Cisco Webex API

    # --- Configuration & Validation ---
    "PyYAML>=6.0",                # YAML config parsing
    "pydantic>=2.7",              # Config validation (optional, for strict mode)

    # --- Git & Change Tracking ---
    "GitPython>=3.1",             # Git operations from Python

    # --- CLI & Orchestration ---
    "click>=8.1",                 # CLI framework

    # --- Utilities ---
    "python-dotenv>=1.0",         # .env file loading
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
watch = [
    "watchdog>=4.0",              # File system watcher for auto-trigger
]
format = [
    "mdformat>=0.7",              # Auto-format output Markdown for consistency
]

[project.scripts]
pm-pipeline = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
